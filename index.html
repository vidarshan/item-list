<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item List Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <section class="doc-header">
      <div class="doc-title-row">
        <input id="listTitle" type="text" placeholder="Items List" />
        <span id="saveStatus" class="save-status" aria-live="polite">Saved</span>
      </div>
      <div class="doc-meta">
        <div class="doc-date" id="docDate"></div>
        <div class="doc-updated" id="docUpdated"></div>
      </div>
    </section>

    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="search" placeholder="Search items…" autocomplete="off" aria-label="Search items" />
    </div>

    <table id="itemsTable">
      <thead>
        <tr>
          <th class="col-name">Item Name</th>
          <th class="col-spec">Spec</th>
          <th class="col-qty">Qty</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="itemsBody">
        <!-- rows injected by app.js -->
      </tbody>
      <tfoot>
        <tr class="empty-row" id="emptyRow">
          <td colspan="4">No items yet. Click "Add" to get started.</td>
        </tr>
      </tfoot>
    </table>

    <div class="fab-cluster">
      <div class="fab-menu" id="fabMenu">
        <button type="button" id="printBtn" class="fab-mini" aria-label="Share or save as PDF">
          <span>Share</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        </button>
        <button type="button" id="restoreDefaultsBtn" class="fab-mini" aria-label="Restore default list">
          <span>Restore</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
        <button type="button" id="clearAllBtn" class="fab-mini fab-mini-danger" aria-label="Clear all items">
          <span>Clear</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </button>
        <button type="button" id="addRowBtn" class="fab-mini" aria-label="Add item">
          <span>Add</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <button type="button" id="fabToggle" class="fab-toggle" aria-label="List actions" aria-expanded="false" aria-controls="fabMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

  </div>

  <div id="printDoc" class="print-doc" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
